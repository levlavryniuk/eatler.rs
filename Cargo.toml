[package]
name = "reatler"
version = "0.6.5"
edition = "2021"
description = "A thing that can bundle files into single one"
license = "MIT"

[dependencies]
walkdir = "2"
arboard = "3.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
